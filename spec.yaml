#! spec.yaml
name: zero2prod
region: nyc
services:
  - name: zero2prod
  # Relative to repository root
    dockerfile_path: Dockerfile
    source_dir: .
    github:
      branch: main
      deploy_on_push: true
      repo: https://github.com/TheNewExecutor/zero2prod
    # Active probe used by DigitialOcean to ensure our application is healthy
    health_check:
      # path to our endpoint we've been using for health checks
      http_path: /health_check
    # Port on which our application listens for incoming requests, should match configuration/production.yaml
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /