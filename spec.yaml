#! spec.yaml
name: zero2prod
region: nyc
services:
  - name: zero2prod
  # Relative to repository root
    dockerfile_path: Dockerfile
    source_dir: .
    github:
      branch: main
      deploy_on_push: true
      repo: TheNewExecutor/zero2prod
    # Active probe used by DigitialOcean to ensure our application is healthy
    health_check:
      # path to our endpoint we've been using for health checks
      http_path: /health_check
    # Port on which our application listens for incoming requests, should match configuration/production.yaml
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: APP_DATABASE__USERNAME
        scope: RUN_TIME
        value: ${newsletter.USERNAME}
      - key: APP_DATABASE__PASSWORD
        scope: RUN_TIME
        value: ${newsletter.PASSWORD}
      - key: APP_DATABASE__HOST
        scope: RUN_TIME
        value: ${newsletter.HOST}
      - key: APP_DATABASE__PORT
        scope: RUN_TIME
        value: ${newsletter.PORT}
      - key: APP_DATABASE__DATABASE_NAME
        scope: RUN_TIME
        value: ${newsletter.DATABASE_NAME}
databases:
  - name: newsletter
  # PG = Postgres
    engine: PG
    # Database name
    num_nodes: 1
    size: db-s-dev-database
    # Postgres version - using the latest here
    version: "18"