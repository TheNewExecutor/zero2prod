[package]
name = "zero2prod"
version = "0.1.0"
authors = ["Jonathan Sarker <thenewexecutor@gmail.com>"]
edition = "2021"

[lib]
# Community conventions specify a library using the `name` field where default is
# package.name, which is what we desire
path = "src/lib.rs"

[dependencies]
config = "0.11"
axum = "0.8.9" # Replace with the latest version
tokio = { version = "1.0", features = ["full"] }
tower = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4.44"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
tracing-log = "0.2"
tracing-bunyan-formatter = "0.3"
tower-http = { version = "0.6", features = ["trace"] }
secrecy = { version = "0.10.3", features = ["serde"] }

# Double brackets signifies array in TOML, implying we can have multiple binaries
# but only one library
[[bin]]
path = "src/main.rs"
name = "zero2prod"

# Dev dependencies are used only when running tests or example, not in final app bin
[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }

# Using table-like toml (dotted keys) to avoid long lines
[dependencies.sqlx]
version = "0.8.6"
default-features = false
features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
]
